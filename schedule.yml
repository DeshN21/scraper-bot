name: Daily Scraper Bot

on:
  schedule:
    # Runs at 18:30 UTC every day, which is exactly 12:00 AM (Midnight) in Sri Lanka (UTC+5:30)
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Scraper
        run: npm start
